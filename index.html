<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Memorial Fantasy Golf League</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/accessibility.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg, #f8f9fa); font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); color: var(--color-text, #1a1a2e); }

/* Header */
.app-header { background: linear-gradient(135deg, #1a472a 0%, #2d5016 100%); color: white; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.app-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.app-title i { font-size: 18px; color: #86efac; }
.app-subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.header-right { text-align: right; }
.header-week { font-size: 14px; font-weight: 600; }
.header-tournament { font-size: 11px; opacity: 0.7; }

/* Tabs */
.tab-bar { display: flex; background: var(--color-surface, #fff); border-bottom: 1px solid var(--color-border-light, #e5e7eb); padding: 0 16px; }
.tab { padding: 12px 20px; font-size: 13px; font-weight: 500; color: var(--color-text-muted, #6b7280); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: var(--color-text, #1a1a2e); }
.tab.active { color: #1a472a; border-bottom-color: #1a472a; font-weight: 600; }
.tab-bar { overflow-x: auto; }
.tab i { margin-right: 6px; }

/* Content */
.content { padding: 20px; max-width: 1200px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }

/* URL Input Bar */
.url-bar { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.url-bar input { flex: 1; border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none; }
.url-bar input:focus { border-color: #1a472a; box-shadow: 0 0 0 2px rgba(26,71,42,0.1); }
.url-bar button { background: #1a472a; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.url-bar button:hover { background: #153a22; }
.url-bar-label { font-size: 12px; color: var(--color-text-muted, #6b7280); white-space: nowrap; }

/* Team Cards */
.team-cards { display: flex; flex-direction: column; gap: 12px; }
.team-card { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 10px; padding: 16px 20px; border-left: 4px solid #ccc; transition: all 0.2s; }
.team-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.team-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.team-rank { font-size: 22px; font-weight: 700; color: var(--color-text-muted, #6b7280); min-width: 30px; }
.team-name { font-size: 15px; font-weight: 600; flex: 1; margin-left: 12px; }
.team-total { font-size: 16px; font-weight: 700; color: #1a472a; }
.team-result { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-left: 12px; }
.team-result.win { background: #dcfce7; color: #166534; }
.team-result.loss { background: #fee2e2; color: #991b1b; }
.golfer-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.golfer-chip { background: var(--color-bg-secondary, #f4f5f7); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 6px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.golfer-earnings { font-weight: 600; color: #1a472a; }

/* Standings Table */
.standings-table { width: 100%; border-collapse: collapse; background: var(--color-surface, #fff); border-radius: 10px; overflow: hidden; border: 1px solid var(--color-border-light, #e5e7eb); }
.standings-table th { background: #1a472a; color: white; padding: 12px 16px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; white-space: nowrap; user-select: none; }
.standings-table th:hover { background: #15522f; }
.standings-table th i { margin-left: 4px; font-size: 10px; }
.standings-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--color-border-light, #e5e7eb); }
.standings-table tr:last-child td { border-bottom: none; }
.standings-table tr:hover td { background: rgba(26,71,42,0.03); }
.rank-cell { font-weight: 700; font-size: 15px; color: var(--color-text-muted, #6b7280); text-align: center; width: 40px; }
.rank-1 { color: #ca8a04; }
.rank-2 { color: #6b7280; }
.rank-3 { color: #b45309; }
.team-cell { font-weight: 600; }
.money-cell { font-family: var(--font-mono, 'SF Mono', monospace); font-size: 12px; text-align: right; }
.pts-cell { font-weight: 700; text-align: center; color: #1a472a; font-size: 14px; }
.loss-cell { text-align: center; color: #dc2626; font-weight: 500; }

/* Roster expand */
.roster-toggle { font-size: 11px; color: #1a472a; cursor: pointer; margin-left: 8px; text-decoration: underline; }
.roster-row { display: none; }
.roster-row.show td { padding: 6px 16px 12px 56px; background: rgba(26,71,42,0.02); font-size: 12px; color: var(--color-text-secondary, #555); }

/* Transactions */
.filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-select { border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 6px; padding: 8px 12px; font-size: 13px; background: var(--color-surface, #fff); outline: none; }
.filter-select:focus { border-color: #1a472a; }
.txn-table { width: 100%; border-collapse: collapse; background: var(--color-surface, #fff); border-radius: 10px; overflow: hidden; border: 1px solid var(--color-border-light, #e5e7eb); }
.txn-table th { background: var(--color-bg-secondary, #f4f5f7); padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; text-align: left; color: var(--color-text-muted, #6b7280); border-bottom: 1px solid var(--color-border-light, #e5e7eb); }
.txn-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--color-border-light, #e5e7eb); }
.txn-table tr:last-child td { border-bottom: none; }
.txn-table tr:hover td { background: rgba(26,71,42,0.02); }
.txn-drop { color: #dc2626; }
.txn-add { color: #059669; }
.txn-fee { font-weight: 600; font-family: var(--font-mono, monospace); }

/* Fee Summary Cards */
/* Total Losses Page */
.losses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
.loss-card { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 10px; padding: 20px; border-left: 4px solid #dc2626; }
.loss-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.loss-card-team { font-size: 15px; font-weight: 600; }
.loss-card-total { font-size: 22px; font-weight: 700; color: #1a1a2e; font-family: var(--font-mono, monospace); }
.loss-breakdown { display: flex; flex-direction: column; gap: 8px; }
.loss-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--color-bg-secondary, #f4f5f7); border-radius: 6px; font-size: 12px; }
.loss-row-label { color: var(--color-text-secondary, #555); }
.loss-row-value { font-weight: 600; font-family: var(--font-mono, monospace); }
.loss-row-detail { font-size: 10px; color: var(--color-text-muted, #6b7280); }
.loss-divider { border-top: 1px dashed var(--color-border-light, #e5e7eb); margin: 4px 0; }
.loss-row-total { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #fef2f2; border-radius: 6px; font-size: 13px; font-weight: 600; color: #1a1a2e; }
.loss-row-total .loss-row-value { color: #1a1a2e; font-size: 14px; font-weight: 700; }

/* Losses chart */
.losses-chart-section { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 10px; padding: 16px; margin-top: 20px; }

/* Losses leaderboard */
.losses-leaderboard { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
.losses-lb-header { background: #dc2626; color: white; padding: 12px 18px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.losses-lb-row { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--color-border-light, #e5e7eb); }
.losses-lb-row:last-child { border-bottom: none; }
.losses-lb-rank { font-size: 16px; font-weight: 700; color: var(--color-text-muted, #6b7280); min-width: 28px; }
.losses-lb-team { flex: 1; font-weight: 500; font-size: 13px; }
.losses-lb-bar-container { flex: 2; padding: 0 12px; }
.losses-lb-bar { height: 20px; border-radius: 4px; background: linear-gradient(90deg, #fee2e2, #fca5a5); position: relative; transition: width 0.3s; }
.losses-lb-bar-inner { position: absolute; right: 6px; top: 2px; font-size: 10px; font-weight: 600; color: #1a1a2e; }
.losses-lb-amount { font-size: 14px; font-weight: 700; color: #1a1a2e; font-family: var(--font-mono, monospace); min-width: 70px; text-align: right; }

/* Fee Summary Cards (Transactions page) */
.fee-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.fee-card { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 8px; padding: 12px; text-align: center; }
.fee-card-team { font-size: 11px; font-weight: 600; color: var(--color-text-secondary, #555); margin-bottom: 4px; }
.fee-card-amount { font-size: 16px; font-weight: 700; color: #dc2626; font-family: var(--font-mono, monospace); }
.fee-card-count { font-size: 10px; color: var(--color-text-muted, #6b7280); margin-top: 2px; }

.chart-section { background: var(--color-surface, #fff); border: 1px solid var(--color-border-light, #e5e7eb); border-radius: 10px; padding: 16px; margin-top: 20px; }

/* Mobile responsive */
@media (max-width: 768px) {
  .app-header { padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
  .header-right { text-align: left; }
  .tab-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { padding: 10px 14px; font-size: 12px; white-space: nowrap; }
  .content { padding: 12px; }
  .url-bar { flex-direction: column; align-items: stretch; }
  .team-card { padding: 12px 14px; }
  .golfer-list { gap: 4px; }
  .golfer-chip { font-size: 11px; padding: 3px 8px; }
  .standings-table { font-size: 11px; }
  .standings-table th, .standings-table td { padding: 8px 8px; }
  .losses-grid { grid-template-columns: 1fr; }
  .losses-lb-row { flex-wrap: wrap; gap: 6px; }
  .losses-lb-bar-container { flex-basis: 100%; order: 3; padding: 4px 0 0 28px; }
  .fee-summary { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
  .filters { flex-direction: column; }
  .txn-table { font-size: 11px; }
  .txn-table th, .txn-table td { padding: 8px 8px; }
}
</style>
</head>

// Scoring rules
const SCORING = {
  regular: {1: "2 pts", 2: "1 pt", 3: "0.5 pts", 4: "Pay $5", 5: "Pay $5", 6: "Pay $5", 7: "Pay $7.50"},
  major: {1: "3 pts", 2: "2 pts", 3: "1 pt", 4: "Pay $5", 5: "Pay $5", 6: "Pay $5", 7: "Pay $7.50"}
};

// ===== TAB SWITCHING =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${tab === 'earnings' ? 1 : tab === 'standings' ? 2 : tab === 'transactions' ? 3 : 4})`).classList.add('active');
  document.getElementById(`page-${tab}`).classList.add('active');
}

// ===== EARNINGS PAGE =====
function renderEarnings() {
  const container = document.getElementById('team-cards');
  container.innerHTML = WEEK32.map(team => {
    const color = TEAMS[team.team]?.color || '#666';
    const isWin = !team.result.startsWith('Pay');
    const golfersSorted = [...team.golfers].sort((a,b) => b.earnings - a.earnings);
    const topEarner = golfersSorted[0]?.name;
    return `
      <div class="team-card" style="border-left-color: ${color}">
        <div class="team-card-header">
          <span class="team-rank">${team.rank === 1 ? '<i class="fa-solid fa-crown" style="color:#ca8a04;font-size:20px;"></i>' : team.rank}</span>
          <span class="team-name">${team.team}</span>
          <span class="team-total">$${team.total.toLocaleString()}</span>
          <span class="team-result ${isWin ? 'win' : 'loss'}">${team.result}</span>
        </div>
        <div class="golfer-list">
          ${golfersSorted.map(g => `
            <div class="golfer-chip" ${team.rank === 1 && g.name === topEarner ? 'style="background:#fef9c3;border-color:#ca8a04;"' : ''}>
              <span ${team.rank === 1 && g.name === topEarner ? 'style="color:#ca8a04;font-weight:700;"' : ''}>${g.name}</span> <span class="golfer-earnings">$${g.earnings.toLocaleString()}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function fetchResults() {
  const url = document.getElementById('results-url').value;
  if (!url) { alert('Please paste a PGA Tour results URL'); return; }
  alert('⚠️ V1 Demo: In the full version, this will fetch live results from pgatour.com and auto-match to your rosters.\n\nCurrently showing pre-loaded Week 32 data.');
}

// ===== STANDINGS PAGE =====
let sortCol = 'points';
let sortDir = -1;

function renderStandings() {
  const sorted = [...STANDINGS].sort((a,b) => {
    if (sortCol === 'team') return sortDir * a.team.localeCompare(b.team);
    return sortDir * (a[sortCol] - b[sortCol]);
  });
  
  const tbody = document.getElementById('standings-body');
  tbody.innerHTML = sorted.map((s, i) => {
    const color = TEAMS[s.team]?.color || '#666';
    const rankClass = i < 3 ? `rank-${i+1}` : '';
    const roster = TEAMS[s.team]?.roster || [];
    return `
      <tr>
        <td class="rank-cell ${rankClass}">${i+1}</td>
        <td class="team-cell" style="color:${color}">${s.team}</td>
        <td class="pts-cell">${s.points}</td>
        <td class="money-cell">$${s.season_total.toLocaleString()}</td>
        <td class="loss-cell">$${s.losses.toFixed(2)}</td>
        <td class="rank-cell">${s.last_place}</td>
        <td><span class="roster-toggle" onclick="toggleRoster(this)">Show roster</span></td>
      </tr>
      <tr class="roster-row">
        <td colspan="7">${roster.join(' • ')}</td>
      </tr>
    `;
  }).join('');
  
  renderPointsChart(sorted);
}

function sortStandings(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = col === 'team' ? 1 : -1; }
  renderStandings();
}

function toggleRoster(el) {
  const row = el.closest('tr').nextElementSibling;
  row.classList.toggle('show');
  el.textContent = row.classList.contains('show') ? 'Hide roster' : 'Show roster';
}

function renderPointsChart(data) {
  const s = getComputedStyle(document.documentElement);
  const get = v => s.getPropertyValue(v).trim();
  
  Highcharts.chart('points-chart', {
    chart: { type: 'bar', backgroundColor: 'transparent', style: { fontFamily: get('--font-sans') } },
    title: { text: 'Season Points', style: { color: get('--color-text'), fontSize: '14px', fontWeight: '600' } },
    xAxis: { categories: data.map(d => d.team), labels: { style: { color: get('--color-text-secondary'), fontSize: '11px' } } },
    yAxis: { title: { text: null }, gridLineColor: get('--color-border-light'), labels: { style: { color: get('--color-text-muted') } } },
    legend: { enabled: false },
    plotOptions: { bar: { borderRadius: 3, dataLabels: { enabled: true, format: '{y}', style: { fontWeight: '600', color: get('--color-text') } } } },
    series: [{ name: 'Points', data: data.map(d => ({ y: d.points, color: TEAMS[d.team]?.color || '#666' })) }],
    tooltip: { pointFormat: '<b>{point.y} pts</b>' },
    credits: { enabled: false }
  });
}

// ===== TRANSACTIONS PAGE =====
function renderTransactions() {
  // Fee summary
  const feeSummary = {};
  const txnCounts = {};
  TRANSACTIONS.forEach(t => {
    feeSummary[t.team] = (feeSummary[t.team] || 0) + 2.50;
    txnCounts[t.team] = (txnCounts[t.team] || 0) + 1;
  });
  
  const feeContainer = document.getElementById('fee-summary');
  feeContainer.innerHTML = Object.entries(feeSummary)
    .sort((a,b) => b[1] - a[1])
    .map(([team, total]) => `
      <div class="fee-card">
        <div class="fee-card-team">${team}</div>
        <div class="fee-card-amount">$${total.toFixed(2)}</div>        
        <div class="fee-card-count">${txnCounts[team]} moves</div>
      </div>
    `).join('');
  
  // Team filter options
  const teamFilter = document.getElementById('filter-team');
  Object.keys(TEAMS).sort().forEach(team => {
    const opt = document.createElement('option');
    opt.value = team; opt.textContent = team;
    teamFilter.appendChild(opt);
  });
  
  filterTransactions();
}

function filterTransactions() {
  const teamFilter = document.getElementById('filter-team').value;
  const monthFilter = document.getElementById('filter-month').value;
  
  let filtered = TRANSACTIONS;
  if (teamFilter) filtered = filtered.filter(t => t.team === teamFilter);
  if (monthFilter) filtered = filtered.filter(t => t.date.substring(5,7) === monthFilter);
  
  const tbody = document.getElementById('txn-body');
  tbody.innerHTML = filtered.map((t, i) => `
    <tr>
      <td style="color:var(--color-text-muted);font-size:11px;">${i+1}</td>
      <td>${formatDate(t.date)}</td>
      <td style="font-weight:500;color:${TEAMS[t.team]?.color || '#666'}">${t.team}</td>
      <td class="txn-drop"><i class="fa-solid fa-circle-minus" style="font-size:10px;margin-right:4px;"></i>${t.drop}</td>
      <td class="txn-add"><i class="fa-solid fa-circle-plus" style="font-size:10px;margin-right:4px;"></i>${t.add}</td>
      <td class="txn-fee">$${t.fee.toFixed(2)}</td>
    </tr>
  `).join('');
}

function formatDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  const [y,m,d] = dateStr.split('-');
  const months = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)]} ${parseInt(d)}`;
}

// ===== TOTAL LOSSES PAGE =====
function renderLosses() {
  // Calculate per-team data
  const lossData = Object.keys(TEAMS).map(team => {
    const teamTxns = TRANSACTIONS.filter(t => t.team === team);
    const txnCount = teamTxns.length;
    const txnCost = txnCount * 2.50;
    const standingEntry = STANDINGS.find(s => s.team === team);
    const weeklyLosses = standingEntry ? standingEntry.losses : 0;
    const totalOwed = txnCost + weeklyLosses;
    return { team, txnCount, txnCost, weeklyLosses, totalOwed };
  }).sort((a,b) => b.totalOwed - a.totalOwed);

  const maxOwed = lossData[0].totalOwed;

  // Leaderboard (ranked bar chart style)
  const lb = document.getElementById('losses-leaderboard');
  lb.innerHTML = `
    <div class="losses-lb-header"><i class="fa-solid fa-skull-crossbones"></i> Total Losses Leaderboard (Most Owed → Least)</div>
    ${lossData.map((d, i) => `
      <div class="losses-lb-row">
        <span class="losses-lb-rank">${i+1}</span>
        <span class="losses-lb-team" style="color:${TEAMS[d.team]?.color || '#666'}">${d.team}</span>
        <span class="losses-lb-bar-container">
          <div class="losses-lb-bar" style="width:${(d.totalOwed / maxOwed * 100).toFixed(1)}%">
            <span class="losses-lb-bar-inner">${d.txnCount} txns + $${d.weeklyLosses.toFixed(2)} losses</span>
          </div>
        </span>
        <span class="losses-lb-amount">$${d.totalOwed.toFixed(2)}</span>
      </div>
    `).join('')}
  `;

  // Detail cards
  const grid = document.getElementById('losses-grid');
  grid.innerHTML = lossData.map(d => `
    <div class="loss-card" style="border-left-color: ${TEAMS[d.team]?.color || '#dc2626'}">
      <div class="loss-card-header">
        <span class="loss-card-team" style="color:${TEAMS[d.team]?.color || '#666'}">${d.team}</span>
        <span class="loss-card-total">$${d.totalOwed.toFixed(2)}</span>
      </div>
      <div class="loss-breakdown">
        <div class="loss-row">
          <span class="loss-row-label"><i class="fa-solid fa-arrows-rotate" style="margin-right:4px;"></i>Transaction Fees</span>
          <span><span class="loss-row-value">$${d.txnCost.toFixed(2)}</span> <span class="loss-row-detail">(${d.txnCount} × $2.50)</span></span>
        </div>
        <div class="loss-row">
          <span class="loss-row-label"><i class="fa-solid fa-arrow-trend-down" style="margin-right:4px;"></i>Weekly Losses</span>
          <span class="loss-row-value">$${d.weeklyLosses.toFixed(2)}</span>
        </div>
        <div class="loss-divider"></div>
        <div class="loss-row-total">
          <span>TOTAL OWED</span>
          <span class="loss-row-value">$${d.totalOwed.toFixed(2)}</span>
        </div>
      </div>
    </div>
  `).join('');

  // Stacked bar chart
  Highcharts.chart('losses-chart', {
    chart: { type: 'bar', backgroundColor: 'transparent' },
    title: { text: 'Loss Breakdown by Team', style: { fontSize: '14px', fontWeight: '600' } },
    xAxis: { categories: lossData.map(d => d.team), labels: { style: { fontSize: '11px' } } },
    yAxis: { title: { text: 'Amount Owed ($)' }, stackLabels: { enabled: true, format: '${total:.2f}', style: { fontWeight: '600', fontSize: '11px' } } },
    legend: { reversed: true, itemStyle: { fontSize: '11px' } },
    plotOptions: { series: { stacking: 'normal', borderRadius: 2 } },
    series: [
      { name: 'Weekly Losses', data: lossData.map(d => d.weeklyLosses), color: '#fca5a5' },
      { name: 'Transaction Fees', data: lossData.map(d => d.txnCost), color: '#f87171' }
    ],
    tooltip: { pointFormat: '{series.name}: <b>${point.y:.2f}</b><br/>Total: <b>${point.stackTotal:.2f}</b>' },
    credits: { enabled: false }
  });
}

// ===== INIT =====
renderEarnings();
renderStandings();
renderTransactions();
renderLosses();
